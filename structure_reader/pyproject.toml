[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "structure_reader"
version = "0.1.0"
description = "模型特征结构阅读工具：S0 输入扫描（输入清单/配置消费/能力报告）；模型图与阅读页属后续阶段"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# 全部为可选：inspect 核心只用标准库。xlsx 导出（S6）实现后可加 openpyxl。
# 以下依赖当前均未在 inspect 中导入，仅未来对应阶段使用时按需检查。
xlsx = ["openpyxl"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["structure_reader*"]
